mds:
  listen_addr: "169.254.169.1:80"
  jwks_path: "/var/lib/prox-mds/jwks.json"
  attestation_ca: "/etc/prox-mds/attestation-ca.pem"
  ek_ca_chain: "/etc/prox-mds/ek-chain.pem"
  # DevID CA (optional). When both are present and enable_tpm_attestation is true,
  # POST /latest/devid/enroll/{start,finish} are registered.
  # Enroll callers must authenticate with MAC→inventory identity AND header
  # X-qemu-mds-ek-cert (base64 DER of the TPM EK certificate).
  devid_ca_cert: "/etc/prox-mds/devid-ca.pem"
  devid_ca_key: "/etc/prox-mds/devid-ca-key.pem"
  token_ttl: "60s"
  jwt_ttl: "5m"
  enable_ec2_compat: true
  enable_tpm_attestation: true
  tpm_device: "/dev/tpm0"
  host_tpm_device: "/dev/tpmrm0"
  signing_key_path: "/var/lib/prox-mds/signing-key.pem"
  # Optional YAML inventory (preferred). When empty, falls back to Proxmox /etc/pve.
  # inventory_path: "/var/lib/mds-lab/inventory/lab.yaml"
