# Proxmox-oriented packaged default. Lab/QEMU hosts should use
# /etc/vtpm-mds/config.lab.yaml from the source tree instead.
#
# Host PKI is installed by Ansible role proxmox-swtpm (not this package):
#   /etc/ssl/certs/proxmox_tpm_ca.crt
#   /etc/ssl/certs/proxmox_devid_ca.crt   ← cluster DevID *intermediate* cert
#   /etc/ssl/private/proxmox_devid_ca.key ← intermediate private key (not the root)
# The offline DevID root private key MUST NOT be installed on hypervisors.
# SPIRE (tpm_devid devid_ca_path) needs the offline *root certificate* only.
# Inventory: empty path → Proxmox /etc/pve (correct on a Proxmox host).
# Listen address matches vmbr_imds + nftables DNAT 169.254.169.254:80 → :80.

mds:
  listen_addr: "169.254.169.1:80"
  jwks_path: "/var/lib/vtpm-mds/jwks.json"
  attestation_ca: "/etc/ssl/certs/proxmox_tpm_ca.crt"
  ek_ca_chain: "/etc/ssl/certs/proxmox_tpm_ca.crt"
  # Cluster intermediate (signing CA). Credential name stays devid_ca.key.
  devid_ca_cert: "/etc/ssl/certs/proxmox_devid_ca.crt"
  devid_ca_key: "/etc/ssl/private/proxmox_devid_ca.key"
  # LDevID lifetime (Go duration). Default 2160h (90 days); max 8760h (1y).
  devid_lifetime: "2160h"
  token_ttl: "60s"
  jwt_ttl: "5m"
  enable_ec2_compat: true
  enable_tpm_attestation: true
  tpm_device: "/dev/tpm0"
  host_tpm_device: "/dev/tpmrm0"
  signing_key_path: "/var/lib/vtpm-mds/signing-key.pem"
  # Empty → parse /etc/pve. Set a YAML path only on non-Proxmox lab hosts.
  # inventory_path: "/var/lib/mds-lab/inventory/lab.yaml"
  # Cluster EK pins (Proxmox only), written by root, read here; see
  # vtpm-mds(8), EK PINS. Turn require_cluster_pin on only after every VM
  # has a cluster pin.
  # cluster_pin_dir: "/etc/pve/vtpm-ek"
  # require_cluster_pin: false
