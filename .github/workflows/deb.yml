# Build the amd64 .debs on Linux and, on a version tag or an
# explicit workflow_dispatch, attach them to a GitHub Release.
#
# One Debian source builds two binary packages at the same version:
#   vtpm-mds_<version>_amd64.deb      host / hypervisor daemon (systemd unit, /etc/vtpm-mds)
#   devid-enroll_<version>_amd64.deb  guest / VM-image DevID enrollment client
#
# Ansible / operator fetch (private repo needs GitHub auth):
#   gh release download v0.2.0 --repo dembaca/vtpm-mds --pattern 'vtpm-mds_*_amd64.deb'
#   gh release download v0.2.0 --repo dembaca/vtpm-mds --pattern 'devid-enroll_*_amd64.deb'
#   https://github.com/dembaca/vtpm-mds/releases/download/v0.2.0/vtpm-mds_0.2.0_amd64.deb
#   https://github.com/dembaca/vtpm-mds/releases/download/v0.2.0/devid-enroll_0.2.0_amd64.deb
#
# Tag must be v<debian-changelog-version>, e.g. v0.2.0 → vtpm-mds_0.2.0_amd64.deb
# and devid-enroll_0.2.0_amd64.deb

name: Debian package

on:
  pull_request:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: Create GitHub Release tag v<debian-version> and attach both amd64 .debs
        type: boolean
        default: false

concurrency:
  group: deb-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-deb:
    name: Build amd64 .debs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      deb-version: ${{ steps.meta.outputs.deb-version }}
      host-deb-basename: ${{ steps.meta.outputs.host-deb-basename }}
      guest-deb-basename: ${{ steps.meta.outputs.guest-deb-basename }}
    steps:
      - name: Require Linux amd64
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          test "$(dpkg --print-architecture)" = amd64

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # golang-go satisfies debian/control Build-Depends (dpkg-checkbuilddeps).
      # setup-go stays first on PATH so the build uses go.mod's 1.24 toolchain,
      # not Ubuntu's older /usr/bin/go.
      - name: Install Debian packaging tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential ca-certificates debhelper dpkg-dev fakeroot \
            golang-go lintian

      - name: Build package
        run: |
          echo "go=$(command -v go) $(go version)"
          make deb

      # The source builds a host and a guest package; both must exist at the
      # changelog version or the release would ship an incomplete pair.
      - name: Record package metadata
        id: meta
        run: |
          set -euo pipefail
          VERSION=$(dpkg-parsechangelog -S Version)
          HOST_DEB="vtpm-mds_${VERSION}_amd64.deb"
          GUEST_DEB="devid-enroll_${VERSION}_amd64.deb"
          missing=0
          for deb in "$HOST_DEB" "$GUEST_DEB"; do
            if [ ! -f "dist/${deb}" ]; then
              echo "::error::missing dist/${deb}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Both the host (vtpm-mds) and guest (devid-enroll) packages must be built at version ${VERSION}."
            ls -lh dist/ || true
            exit 1
          fi
          {
            echo "deb-version=${VERSION}"
            echo "host-deb-basename=${HOST_DEB}"
            echo "guest-deb-basename=${GUEST_DEB}"
          } >> "$GITHUB_OUTPUT"
          ls -lh dist/*.deb
          dpkg-deb -I "dist/${HOST_DEB}"
          dpkg-deb -I "dist/${GUEST_DEB}"

      - name: Lintian
        run: |
          lintian --fail-on error,warning \
            "dist/${{ steps.meta.outputs.host-deb-basename }}" \
            "dist/${{ steps.meta.outputs.guest-deb-basename }}"

      - name: Upload host package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.host-deb-basename }}
          path: dist/${{ steps.meta.outputs.host-deb-basename }}
          if-no-files-found: error

      - name: Upload guest package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.guest-deb-basename }}
          path: dist/${{ steps.meta.outputs.guest-deb-basename }}
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build-deb
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      DEB_VERSION: ${{ needs.build-deb.outputs.deb-version }}
      HOST_DEB_BASENAME: ${{ needs.build-deb.outputs.host-deb-basename }}
      GUEST_DEB_BASENAME: ${{ needs.build-deb.outputs.guest-deb-basename }}
    steps:
      - name: Resolve release tag
        id: tag
        run: |
          set -euo pipefail
          EXPECTED="v${DEB_VERSION}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            if [[ "$TAG" != "$EXPECTED" ]]; then
              echo "Tag ${TAG} must be ${EXPECTED} (debian/changelog Version ${DEB_VERSION})"
              exit 1
            fi
          else
            TAG="$EXPECTED"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Download host package
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.HOST_DEB_BASENAME }}
          path: dist

      - name: Download guest package
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.GUEST_DEB_BASENAME }}
          path: dist

      - name: Publish GitHub Release
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          HOST_DEB="dist/${HOST_DEB_BASENAME}"
          GUEST_DEB="dist/${GUEST_DEB_BASENAME}"
          test -f "$HOST_DEB"
          test -f "$GUEST_DEB"
          NOTES="Debian packages for ${TAG} (Linux amd64), built from one source at version ${DEB_VERSION}.

          Host / hypervisor package: \`${HOST_DEB_BASENAME}\`
          The vtpm-mds IMDS daemon, its systemd unit and \`/etc/vtpm-mds\`. Install on Proxmox/QEMU hosts.

          \`\`\`
          gh release download ${TAG} --repo dembaca/vtpm-mds --pattern 'vtpm-mds_*_amd64.deb'
          \`\`\`

          Guest / VM-image package: \`${GUEST_DEB_BASENAME}\`
          The devid-enroll client only. Install in VM images; it installs no daemon and no systemd unit.

          \`\`\`
          gh release download ${TAG} --repo dembaca/vtpm-mds --pattern 'devid-enroll_*_amd64.deb'
          \`\`\`

          Direct URLs (private repo: authenticate):

          https://github.com/dembaca/vtpm-mds/releases/download/${TAG}/${HOST_DEB_BASENAME}
          https://github.com/dembaca/vtpm-mds/releases/download/${TAG}/${GUEST_DEB_BASENAME}
          "
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$HOST_DEB" "$GUEST_DEB" --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" "$HOST_DEB" "$GUEST_DEB" \
              --title "$TAG" \
              --notes "$NOTES" \
              --target "${GITHUB_SHA}"
          fi
          gh release view "$TAG"
          echo "Host download:  https://github.com/dembaca/vtpm-mds/releases/download/${TAG}/${HOST_DEB_BASENAME}"
          echo "Guest download: https://github.com/dembaca/vtpm-mds/releases/download/${TAG}/${GUEST_DEB_BASENAME}"
