# SPIRE 1.14 server for the reconcile lab (trust domain lab.local).
# Paths under /var/lib/mds-lab/spire/.
server {
    bind_address = "169.254.169.1"
    bind_port = "8081"
    socket_path = "/var/lib/mds-lab/spire/sockets/server.sock"
    trust_domain = "lab.local"
    data_dir = "/var/lib/mds-lab/spire/data/server"
    log_level = "INFO"
    ca_ttl = "168h"
    default_x509_svid_ttl = "1h"
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type = "sqlite3"
            connection_string = "/var/lib/mds-lab/spire/data/server/datastore.sqlite3"
        }
    }

    KeyManager "disk" {
        plugin_data {
            keys_path = "/var/lib/mds-lab/spire/data/server/keys.json"
        }
    }

    # Offline DevID root (two-tier lab PKI). Intermediate fingerprints appear
    # on agents as ca:fingerprint selectors alongside the root.
    NodeAttestor "tpm_devid" {
        plugin_data {
            devid_ca_path = "/var/lib/mds-lab/spire/conf/server/devid-ca.pem"
            endorsement_ca_path = "/var/lib/mds-lab/spire/conf/server/ek-chain.pem"
        }
    }
}

health_checks {
    listener_enabled = true
    bind_address = "127.0.0.1"
    bind_port = "8082"
    live_path = "/live"
    ready_path = "/ready"
}
